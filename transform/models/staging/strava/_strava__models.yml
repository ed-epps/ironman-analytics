version: 2

models:
  - name: stg_strava__activities
    description: >
      One row per Strava activity. De-duplicated (latest extract wins), renamed and converted
      to km / seconds. Power is kept only for real power-meter data. No business rules here.
    columns:
      - name: activity_id
        description: Strava's activity ID. Primary key.
        data_tests:
          - unique
          - not_null

      - name: sport_type
        description: Strava's sport type. Every value must exist in the sport_types seed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sport_types')
                field: sport_type

      - name: activity_date
        description: Local calendar date the activity started.
        data_tests:
          - not_null

      - name: route_polyline
        description: >
          Strava's simplified route (encoded polyline). Private - a home privacy mask must be
          applied before any route is published.
